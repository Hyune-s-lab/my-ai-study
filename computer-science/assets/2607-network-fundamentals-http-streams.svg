<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title description">
  <title id="title">HTTP 버전별 요청 처리와 스트림</title>
  <desc id="description">HTTP 버전별 요청 처리와 스트림。색은 처리와 저장소의 역할을 구분하며, 선은 명시된 관계만 나타낸다.</desc>
