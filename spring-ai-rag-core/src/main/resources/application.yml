spring:
  datasource:
    url: jdbc:postgresql://localhost:35432/rag_db
    username: postgres
    password: password1

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small   # 임베딩 모델 (dimensions와 일치해야 함)
    vectorstore:
      pgvector:
        initialize-schema: false           # init.sql에서 직접 생성 (tsvector 포함)
        index-type: HNSW                   # 벡터 인덱스 알고리즘 (HNSW가 가장 빠름)
        distance-type: COSINE_DISTANCE     # 유사도 계산 방식 (코사인 유사도)
        dimensions: 1536                   # 임베딩 벡터 차원 (OpenAI text-embedding-3-small 기본값)
