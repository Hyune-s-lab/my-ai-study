<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 Z" fill="#94a3b8"/></marker>
    <g id="aws-client"><rect width="28" height="28" rx="6" fill="#64748b"/><circle cx="14" cy="11" r="4" fill="#fff"/><path d="M6,23 C6,16 22,16 22,23 Z" fill="#fff"/></g>
    <g id="aws-compute"><rect width="28" height="28" rx="6" fill="#ED7100"/><rect x="7" y="7" width="6" height="6" rx="1" fill="#fff"/><rect x="15" y="7" width="6" height="6" rx="1" fill="#fff"/><rect x="7" y="15" width="6" height="6" rx="1" fill="#fff"/><rect x="15" y="15" width="6" height="6" rx="1" fill="#fff"/></g>
    <g id="aws-gov"><rect width="28" height="28" rx="6" fill="#DD344C"/><path d="M14,5 L23,11 L5,11 Z" fill="#fff"/><rect x="7" y="12" width="3" height="9" fill="#fff"/><rect x="13" y="12" width="3" height="9" fill="#fff"/><rect x="19" y="12" width="3" height="9" fill="#fff"/><rect x="5" y="22" width="18" height="2.5" fill="#fff"/></g>
  </defs>
  <rect width="1040" height="430" fill="#f8fafc"/>
  <text x="30" y="38" font-size="21" font-weight="700" fill="#0f172a">L0 — 화이트보드: 가장 단순한 동기 안 (의도적으로 깨지는 그림)</text>
  <text x="30" y="62" font-size="13" fill="#64748b">"숨은 환급액 찾기"를 그냥 동기 요청-응답으로 만들면? — 왜 못 버티는지부터 짚는다.</text>

  <rect x="40" y="150" width="160" height="80" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <use href="#aws-client" x="54" y="164" width="26" height="26"/>
  <text x="90" y="182" font-size="13" font-weight="700" fill="#334155">모바일 앱</text>
  <text x="54" y="210" font-size="10.5" fill="#475569">사용자 요청 / 3분 대기</text>

  <rect x="250" y="150" width="180" height="80" rx="9" fill="#fff" stroke="#ED7100" stroke-width="1.6"/>
  <use href="#aws-compute" x="264" y="164" width="26" height="26"/>
  <text x="300" y="178" font-size="13" font-weight="700" fill="#9a3412">API 서버 (동기)</text>
  <text x="264" y="206" font-size="10.5" fill="#475569">ECS — 요청 스레드 점유</text>

  <rect x="480" y="150" width="210" height="80" rx="9" fill="#fef2f2" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <use href="#aws-gov" x="494" y="164" width="26" height="26"/>
  <text x="530" y="174" font-size="12.5" font-weight="700" fill="#b91c1c">국세청 홈택스/손택스</text>
  <text x="494" y="200" font-size="10" fill="#7f1d1d">외부 의존 · 스크래핑/연동</text>
  <text x="494" y="216" font-size="10" fill="#7f1d1d">응답 수십 초~분 · 점검·폭주</text>

  <rect x="740" y="150" width="170" height="80" rx="9" fill="#fff" stroke="#ED7100" stroke-width="1.6"/>
  <use href="#aws-compute" x="754" y="164" width="26" height="26"/>
  <text x="790" y="178" font-size="13" font-weight="700" fill="#9a3412">계산 엔진</text>
  <text x="754" y="206" font-size="10.5" fill="#475569">세법 룰 기반 산출</text>

  <line x1="200" y1="190" x2="248" y2="190" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <line x1="430" y1="190" x2="478" y2="190" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="437" y="182" font-size="10" fill="#b91c1c">수집(느림)</text>
  <line x1="690" y1="190" x2="738" y2="190" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <path d="M820,150 C820,110 200,110 120,148" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="470" y="104" font-size="10.5" fill="#94a3b8" text-anchor="middle">동기 응답 (전부 끝날 때까지 한 번에)</text>

  <rect x="40" y="262" width="870" height="118" rx="10" fill="#fff1f2" stroke="#fda4af" stroke-width="1.4"/>
  <text x="58" y="286" font-size="13" font-weight="700" fill="#b91c1c">⛔ 이대로는 못 버티는 이유</text>
  <text x="58" y="310" font-size="11.5" fill="#7f1d1d">1. 국세청 호출이 수십 초~분 → HTTP 타임아웃 · 사용자를 3분 동기 대기시킬 수 없음</text>
  <text x="58" y="330" font-size="11.5" fill="#7f1d1d">2. 국세청 점검·폭주 시 전체 요청 실패 — 장애 격리(bulkhead/CB) 없음</text>
  <text x="58" y="350" font-size="11.5" fill="#7f1d1d">3. 동기 처리 → 5월 종소세 폭증에 스레드/커넥션 풀 고갈 → cascading failure</text>
  <text x="58" y="370" font-size="11.5" fill="#7f1d1d">4. 상태가 없음 → 중간 실패하면 처음부터 다시 (수집·계산 재낭비)</text>

  <text x="930" y="320" font-size="12" font-weight="700" fill="#15803d" transform="rotate(90 930 320)" text-anchor="middle">→ L1: 비동기 + 상태관리</text>
</svg>
