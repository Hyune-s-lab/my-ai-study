<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8b5cf6"/></marker>
    <marker id="ms" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1520" height="980" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">스프링 클라우드 마이크로서비스 레퍼런스 아키텍처</text>
  <text x="30" y="64" font-size="13" fill="#64748b">출처: 『스프링 마이크로서비스 코딩 공작소』 — 게이트웨이·디스커버리·구성·인증·Resilience4j·Kafka·관측(ELK·Zipkin·Prometheus/Grafana)</text>

  <!-- 구성 서비스 저장소 -->
  <rect x="560" y="86" width="220" height="58" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="574" y="98" width="13" height="13" rx="3" fill="#8b5cf6"/>
  <text x="594" y="109" font-size="12.5" font-weight="700" fill="#6d28d9">구성 서비스 저장소</text>
  <text x="574" y="132" font-size="10" fill="#475569">Spring Cloud Config</text>

  <!-- 조직 DB -->
  <rect x="840" y="168" width="190" height="56" rx="9" fill="#eff6ff" stroke="#4053D6" stroke-width="1.6"/>
  <rect x="854" y="180" width="13" height="13" rx="3" fill="#4053D6"/>
  <text x="874" y="191" font-size="12.5" font-weight="700" fill="#3730a3">조직 데이터베이스</text>
  <text x="854" y="213" font-size="10" fill="#475569">Organization DB</text>

  <!-- 클라이언트 -->
  <rect x="40" y="450" width="160" height="84" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="54" y="464" width="13" height="13" rx="3" fill="#64748b"/>
  <text x="74" y="475" font-size="12.5" font-weight="700" fill="#334155">클라이언트</text>
  <text x="54" y="500" font-size="10" fill="#475569">웹/모바일</text>
  <text x="54" y="518" font-size="10" fill="#475569">토큰 첨부 요청</text>

  <!-- 키클록 -->
  <rect x="40" y="750" width="200" height="80" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="54" y="762" width="13" height="13" rx="3" fill="#8b5cf6"/>
  <text x="74" y="773" font-size="12.5" font-weight="700" fill="#6d28d9">키클록 서버</text>
  <text x="54" y="797" font-size="10" fill="#475569">Keycloak</text>
  <text x="54" y="815" font-size="10" fill="#475569">인증 · OAuth2/OIDC 토큰</text>

  <!-- 유레카 -->
  <rect x="300" y="310" width="210" height="82" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <rect x="314" y="322" width="13" height="13" rx="3" fill="#8b5cf6"/>
  <text x="334" y="333" font-size="12.5" font-weight="700" fill="#6d28d9">서비스 디스커버리</text>
  <text x="314" y="357" font-size="10.5" fill="#475569">Eureka — 서비스 등록/조회</text>

  <!-- 게이트웨이 -->
  <rect x="290" y="548" width="220" height="104" rx="9" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="304" y="560" width="13" height="13" rx="3" fill="#8b5cf6"/>
  <text x="324" y="571" font-size="12.5" font-weight="700" fill="#6d28d9">서비스 게이트웨이</text>
  <text x="304" y="595" font-size="10.5" fill="#475569">Spring Cloud Gateway</text>
  <text x="304" y="613" font-size="10.5" fill="#475569">라우팅 · 토큰 검증 · 필터</text>

  <!-- 조직 서비스 -->
  <rect x="580" y="300" width="330" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="596" y="314" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="618" y="326" font-size="13.5" font-weight="700" fill="#6d28d9">조직 서비스 (Organization)</text>
  <text x="596" y="350" font-size="10.5" fill="#475569">조직 정보 도메인 · 이벤트 발행</text>
  <rect x="596" y="394" width="298" height="32" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="745" y="415" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Resilience4j (CB · Retry · Bulkhead)</text>

  <!-- 라이선싱 서비스 -->
  <rect x="580" y="590" width="330" height="140" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="596" y="604" width="14" height="14" rx="3" fill="#8b5cf6"/>
  <text x="618" y="616" font-size="13.5" font-weight="700" fill="#6d28d9">라이선싱 서비스 (Licensing)</text>
  <text x="596" y="640" font-size="10.5" fill="#475569">라이선스 도메인 · 이벤트 구독</text>
  <rect x="596" y="684" width="298" height="32" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="745" y="705" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Resilience4j (CB · Retry · Bulkhead)</text>

  <!-- Kafka -->
  <rect x="955" y="478" width="150" height="86" rx="9" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <rect x="969" y="490" width="13" height="13" rx="3" fill="#334155"/>
  <text x="989" y="501" font-size="12.5" font-weight="700" fill="#0f172a">Kafka</text>
  <text x="969" y="524" font-size="10.5" fill="#475569">토픽 (이벤트)</text>
  <text x="969" y="546" font-size="10" fill="#475569">발행 ▸ 구독</text>

  <!-- 라이선싱 DB -->
  <rect x="580" y="782" width="180" height="56" rx="9" fill="#eff6ff" stroke="#4053D6" stroke-width="1.6"/>
  <rect x="594" y="794" width="13" height="13" rx="3" fill="#4053D6"/>
  <text x="614" y="805" font-size="12" font-weight="700" fill="#3730a3">라이선싱 DB</text>
  <text x="594" y="826" font-size="9.5" fill="#475569">Licensing DB</text>

  <!-- Redis -->
  <rect x="790" y="782" width="130" height="56" rx="9" fill="#fef2f2" stroke="#DD344C" stroke-width="1.6"/>
  <rect x="804" y="794" width="13" height="13" rx="3" fill="#DD344C"/>
  <text x="824" y="805" font-size="12" font-weight="700" fill="#b91c1c">Redis</text>
  <text x="804" y="826" font-size="9.5" fill="#475569">조회 캐시</text>

  <!-- ===== 관측 스택 (도커 컨테이너) ===== -->
  <text x="1150" y="232" font-size="12.5" font-weight="700" fill="#0369a1">도커 컨테이너 — 관측(Observability) 스택</text>

  <rect x="1150" y="250" width="220" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1166" y="280" font-size="12.5" font-weight="700" fill="#0c4a6e">Zipkin</text>
  <text x="1166" y="302" font-size="10" fill="#475569">분산 추적 (trace)</text>

  <rect x="1150" y="370" width="220" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1166" y="400" font-size="12.5" font-weight="700" fill="#0c4a6e">Logstash</text>
  <text x="1166" y="422" font-size="10" fill="#475569">로그 수집/가공</text>

  <rect x="1150" y="560" width="220" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1166" y="590" font-size="12.5" font-weight="700" fill="#0c4a6e">Elasticsearch</text>
  <text x="1166" y="612" font-size="10" fill="#475569">로그 저장/색인</text>

  <rect x="1390" y="560" width="115" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1406" y="590" font-size="12.5" font-weight="700" fill="#0c4a6e">Kibana</text>
  <text x="1406" y="612" font-size="10" fill="#475569">로그 질의</text>

  <rect x="1150" y="770" width="240" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1166" y="797" font-size="11.5" font-weight="700" fill="#0c4a6e">Prometheus</text>
  <text x="1166" y="818" font-size="10" fill="#475569">스프링 부트 액추에이터 지표</text>

  <rect x="1410" y="770" width="100" height="70" rx="9" fill="#fff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1426" y="800" font-size="12" font-weight="700" fill="#0c4a6e">Grafana</text>
  <text x="1426" y="820" font-size="10" fill="#475569">대시보드</text>

  <!-- ===== 화살표 ===== -->
  <!-- 클라이언트 ↔ 게이트웨이 (토큰) -->
  <line x1="200" y1="500" x2="288" y2="565" stroke="#64748b" stroke-width="1.8" marker-end="url(#m)" marker-start="url(#ms)"/>
  <text x="200" y="548" font-size="10" fill="#6d28d9">토큰 요청/응답</text>
  <!-- 클라이언트 → 키클록 (인증) -->
  <line x1="118" y1="534" x2="118" y2="748" stroke="#64748b" stroke-width="1.6" marker-end="url(#m)" marker-start="url(#ms)"/>
  <text x="126" y="650" font-size="10" fill="#475569">인증 요청 / 토큰</text>
  <!-- 키클록 → 게이트웨이 (검증) -->
  <line x1="240" y1="775" x2="370" y2="654" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)" stroke-dasharray="5 4"/>
  <text x="252" y="730" font-size="9.5" fill="#475569">토큰 검증(JWK)</text>
  <!-- 게이트웨이 ↔ 유레카 -->
  <line x1="400" y1="548" x2="400" y2="394" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#mp)" marker-start="url(#ms)"/>
  <text x="408" y="470" font-size="9.5" fill="#6d28d9">등록/조회</text>
  <!-- 게이트웨이 → 조직 서비스 -->
  <line x1="510" y1="575" x2="578" y2="420" stroke="#64748b" stroke-width="1.6" marker-end="url(#m)"/>
  <!-- 게이트웨이 → 라이선싱 서비스 -->
  <line x1="510" y1="615" x2="578" y2="650" stroke="#64748b" stroke-width="1.6" marker-end="url(#m)"/>
  <!-- 조직 서비스 → Config -->
  <line x1="700" y1="300" x2="690" y2="146" stroke="#8b5cf6" stroke-width="1.4" marker-end="url(#mp)" marker-start="url(#ms)"/>
  <text x="700" y="230" font-size="9.5" fill="#6d28d9">구성 로드</text>
  <!-- 조직 서비스 → 조직 DB -->
  <line x1="850" y1="300" x2="910" y2="226" stroke="#64748b" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="858" y="270" font-size="9.5" fill="#475569">데이터 조회</text>
  <!-- 라이선싱 → 라이선싱 DB -->
  <line x1="660" y1="730" x2="660" y2="780" stroke="#64748b" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="668" y="762" font-size="9.5" fill="#475569">조회</text>
  <!-- 라이선싱 → Redis -->
  <line x1="820" y1="730" x2="850" y2="780" stroke="#DD344C" stroke-width="1.5" marker-end="url(#m)"/>
  <text x="830" y="762" font-size="9.5" fill="#b91c1c">캐시</text>
  <!-- 조직 → Kafka (발행) -->
  <line x1="910" y1="400" x2="1010" y2="476" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="930" y="445" font-size="9.5" fill="#0f172a">발행</text>
  <!-- Kafka → 라이선싱 (구독) -->
  <line x1="1010" y1="564" x2="910" y2="645" stroke="#334155" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="930" y="610" font-size="9.5" fill="#0f172a">구독</text>

  <!-- 서비스 → Zipkin -->
  <line x1="910" y1="330" x2="1148" y2="282" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="980" y="300" font-size="9.5" fill="#475569">분산 추적</text>
  <!-- 서비스 → Logstash -->
  <line x1="910" y1="360" x2="1148" y2="400" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="980" y="392" font-size="9.5" fill="#475569">로그 전달</text>
  <!-- Logstash → ES -->
  <line x1="1260" y1="440" x2="1260" y2="558" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="1268" y="505" font-size="9.5" fill="#475569">전달</text>
  <!-- Kibana → ES -->
  <line x1="1388" y1="595" x2="1372" y2="595" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="1300" y="555" font-size="9.5" fill="#475569">질의</text>
  <!-- 라이선싱 → Prometheus -->
  <line x1="910" y1="690" x2="1148" y2="795" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="980" y="745" font-size="9.5" fill="#475569">애플리케이션 지표</text>
  <!-- Grafana → Prometheus -->
  <line x1="1408" y1="805" x2="1392" y2="805" stroke="#64748b" stroke-width="1.4" marker-end="url(#m)"/>
  <text x="1300" y="765" font-size="9.5" fill="#475569">질의</text>

  <!-- 범례 -->
  <rect x="40" y="900" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#8b5cf6"/><text x="60" y="911" font-size="11" fill="#334155">Spring 앱</text>
  <rect x="150" y="900" width="14" height="14" rx="3" fill="#eff6ff" stroke="#4053D6"/><text x="170" y="911" font-size="11" fill="#334155">DB</text>
  <rect x="220" y="900" width="14" height="14" rx="3" fill="#fef2f2" stroke="#DD344C"/><text x="240" y="911" font-size="11" fill="#334155">Redis</text>
  <rect x="300" y="900" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#334155"/><text x="320" y="911" font-size="11" fill="#334155">Kafka</text>
  <rect x="380" y="900" width="14" height="14" rx="3" fill="#fff" stroke="#0ea5e9" stroke-dasharray="3 2"/><text x="400" y="911" font-size="11" fill="#334155">도커 컨테이너(관측)</text>
</svg>
