<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="bd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0ea5e9"/></marker>
    <marker id="bg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#22c55e"/></marker>
  </defs>
  <rect width="1120" height="660" fill="#f8fafc"/>
  <text x="30" y="36" font-size="21" font-weight="700" fill="#0f172a">L1 — 비동기 잡 + 상태 관리</text>
  <text x="30" y="59" font-size="13" fill="#64748b">느린 국세청 수집을 워커 잡으로 분리하고, 진행 상태를 저장한다. 사용자는 즉시 jobId를 받고 폴링/푸시로 결과를 받는다.</text>

  <!-- Client -->
  <rect x="40" y="92" width="170" height="62" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <rect x="54" y="104" width="13" height="13" rx="3" fill="#64748b"/>
  <text x="74" y="115" font-size="12.5" font-weight="700" fill="#334155">모바일 앱</text>
  <text x="54" y="140" font-size="10" fill="#475569">jobId 받고 폴링 / 푸시 수신</text>

  <!-- API Gateway -->
  <rect x="40" y="220" width="160" height="66" rx="9" fill="#fff" stroke="#8C4FFF" stroke-width="1.6"/>
  <rect x="54" y="232" width="13" height="13" rx="3" fill="#8C4FFF"/>
  <text x="74" y="243" font-size="12.5" font-weight="700" fill="#5b21b6">API Gateway</text>
  <text x="54" y="268" font-size="10" fill="#475569">인증 · 라우팅 · 레이트리밋</text>

  <!-- API (ECS) -->
  <rect x="40" y="330" width="160" height="74" rx="9" fill="#fff" stroke="#ED7100" stroke-width="1.6"/>
  <rect x="54" y="342" width="13" height="13" rx="3" fill="#ED7100"/>
  <text x="74" y="353" font-size="12.5" font-weight="700" fill="#9a3412">API (ECS)</text>
  <text x="54" y="377" font-size="10" fill="#475569">잡 생성 → 즉시 jobId 반환</text>
  <text x="54" y="393" font-size="10" fill="#475569">상태 조회(폴링) 응답</text>

  <!-- SQS -->
  <rect x="270" y="220" width="180" height="66" rx="9" fill="#fff" stroke="#E7157B" stroke-width="1.6"/>
  <rect x="284" y="232" width="13" height="13" rx="3" fill="#E7157B"/>
  <text x="304" y="243" font-size="12.5" font-weight="700" fill="#9d174d">SQS (잡 큐)</text>
  <text x="284" y="268" font-size="10" fill="#475569">수집 작업 발행 · 버퍼링</text>

  <!-- DynamoDB state -->
  <rect x="270" y="330" width="180" height="74" rx="9" fill="#fff" stroke="#4053D6" stroke-width="1.8"/>
  <rect x="284" y="342" width="13" height="13" rx="3" fill="#4053D6"/>
  <text x="304" y="353" font-size="12.5" font-weight="700" fill="#3730a3">DynamoDB</text>
  <text x="284" y="377" font-size="10" fill="#475569">잡 상태 + 미리보기 결과</text>
  <text x="284" y="393" font-size="10" fill="#475569">(jobId 키)</text>

  <!-- SNS / Pinpoint -->
  <rect x="40" y="450" width="160" height="62" rx="9" fill="#fff" stroke="#E7157B" stroke-width="1.6"/>
  <rect x="54" y="462" width="13" height="13" rx="3" fill="#E7157B"/>
  <text x="74" y="473" font-size="12.5" font-weight="700" fill="#9d174d">SNS / Pinpoint</text>
  <text x="54" y="498" font-size="10" fill="#475569">완료 푸시 알림</text>

  <!-- Worker -->
  <rect x="520" y="220" width="180" height="74" rx="9" fill="#fff" stroke="#ED7100" stroke-width="1.8"/>
  <rect x="534" y="232" width="13" height="13" rx="3" fill="#ED7100"/>
  <text x="554" y="243" font-size="12.5" font-weight="700" fill="#9a3412">Worker (ECS)</text>
  <text x="534" y="267" font-size="10" fill="#475569">큐 소비 → 수집 → 계산</text>
  <text x="534" y="283" font-size="10" fill="#475569">→ 상태/결과 저장</text>

  <!-- 국세청 -->
  <rect x="770" y="92" width="300" height="74" rx="9" fill="#fef2f2" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <rect x="784" y="104" width="13" height="13" rx="3" fill="#DD344C"/>
  <text x="804" y="115" font-size="12.5" font-weight="700" fill="#b91c1c">국세청 홈택스/손택스 (외부)</text>
  <text x="784" y="139" font-size="10" fill="#7f1d1d">소득·지출·원천징수 데이터 수집</text>
  <text x="784" y="155" font-size="10" fill="#7f1d1d">느림 · 점검·폭주 (L2에서 보호)</text>

  <!-- 계산 엔진 -->
  <rect x="770" y="220" width="180" height="74" rx="9" fill="#fff" stroke="#ED7100" stroke-width="1.6"/>
  <rect x="784" y="232" width="13" height="13" rx="3" fill="#ED7100"/>
  <text x="804" y="243" font-size="12.5" font-weight="700" fill="#9a3412">계산 엔진</text>
  <text x="784" y="267" font-size="10" fill="#475569">세법 룰 기반</text>
  <text x="784" y="283" font-size="10" fill="#475569">환급/세액 산출</text>

  <!-- S3 -->
  <rect x="770" y="330" width="180" height="66" rx="9" fill="#fff" stroke="#7AA116" stroke-width="1.6"/>
  <rect x="784" y="342" width="13" height="13" rx="3" fill="#7AA116"/>
  <text x="804" y="353" font-size="12.5" font-weight="700" fill="#3f6212">S3</text>
  <text x="784" y="377" font-size="10" fill="#475569">원천 데이터 · 신고서 PDF</text>

  <!-- arrows -->
  <line x1="125" y1="154" x2="125" y2="218" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="132" y="190" font-size="9.5" fill="#64748b">요청</text>
  <line x1="120" y1="286" x2="120" y2="328" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <!-- API -> SQS enqueue -->
  <line x1="200" y1="350" x2="268" y2="270" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="206" y="318" font-size="9.5" fill="#9d174d">enqueue</text>
  <!-- API <-> DynamoDB -->
  <line x1="200" y1="372" x2="268" y2="372" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#bd)"/>
  <text x="205" y="365" font-size="9.5" fill="#0369a1">상태 r/w</text>
  <!-- SQS -> Worker consume -->
  <line x1="450" y1="255" x2="518" y2="255" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="456" y="247" font-size="9.5" fill="#9d174d">consume</text>
  <!-- Worker -> 국세청 -->
  <line x1="640" y1="220" x2="760" y2="150" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="648" y="180" font-size="9.5" fill="#b91c1c">수집</text>
  <!-- Worker -> 계산 -->
  <line x1="700" y1="257" x2="768" y2="257" stroke="#64748b" stroke-width="1.6" marker-end="url(#b)"/>
  <text x="708" y="249" font-size="9.5" fill="#64748b">계산</text>
  <!-- Worker -> DynamoDB (update) -->
  <line x1="520" y1="290" x2="452" y2="360" stroke="#0ea5e9" stroke-width="1.6" marker-end="url(#bd)"/>
  <text x="455" y="318" font-size="9.5" fill="#0369a1">상태/결과 저장</text>
  <!-- Worker -> S3 -->
  <line x1="760" y1="350" x2="702" y2="300" stroke="#22c55e" stroke-width="1.6" marker-end="url(#bg)"/>
  <!-- DynamoDB -> SNS (완료시 푸시) : via worker, draw worker->sns -->
  <path d="M520,294 C300,330 150,400 120,448" stroke="#E7157B" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="250" y="408" font-size="9.5" fill="#9d174d">완료 → 푸시</text>
  <!-- SNS -> Client -->
  <path d="M120,450 C120,300 120,200 120,156" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>

  <!-- 상태 전이 -->
  <rect x="40" y="540" width="1030" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
  <text x="58" y="564" font-size="13" font-weight="700" fill="#15803d">상태 머신 (jobId 단위, DynamoDB에 저장)</text>
  <g font-size="11.5" font-weight="700">
    <rect x="60" y="580" width="130" height="38" rx="8" fill="#fff" stroke="#86efac"/><text x="125" y="603" fill="#166534" text-anchor="middle">REQUESTED</text>
    <rect x="240" y="580" width="140" height="38" rx="8" fill="#fff" stroke="#86efac"/><text x="310" y="603" fill="#166534" text-anchor="middle">COLLECTING</text>
    <rect x="430" y="580" width="150" height="38" rx="8" fill="#fff" stroke="#86efac"/><text x="505" y="603" fill="#166534" text-anchor="middle">CALCULATING</text>
    <rect x="630" y="580" width="160" height="38" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="710" y="603" fill="#15803d" text-anchor="middle">READY (미리보기)</text>
    <rect x="840" y="580" width="150" height="38" rx="8" fill="#fff7ed" stroke="#fdba74"/><text x="915" y="603" fill="#9a3412" text-anchor="middle">FAILED / 재시도</text>
  </g>
  <line x1="190" y1="599" x2="238" y2="599" stroke="#22c55e" stroke-width="1.6" marker-end="url(#bg)"/>
  <line x1="380" y1="599" x2="428" y2="599" stroke="#22c55e" stroke-width="1.6" marker-end="url(#bg)"/>
  <line x1="580" y1="599" x2="628" y2="599" stroke="#22c55e" stroke-width="1.6" marker-end="url(#bg)"/>
  <line x1="790" y1="599" x2="838" y2="599" stroke="#fb923c" stroke-width="1.4" marker-end="url(#b)"/>
</svg>
