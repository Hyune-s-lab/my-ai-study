<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="cr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#DD344C"/></marker>
  </defs>
  <rect width="1160" height="660" fill="#f8fafc"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#0f172a">L2 — 리질리언스 + 셀프 신고 사가 + 횡단 관심사</text>
  <text x="30" y="56" font-size="13" fill="#64748b">국세청 연동을 보호하고(①), 부작용 있는 "제출"을 정확히 한 번으로 만들고(②), 보안·룰셋·관측을 얹는다(③).</text>

  <!-- ① 리질리언스 -->
  <text x="40" y="86" font-size="14" font-weight="700" fill="#9a3412">① 국세청 연동 리질리언스</text>

  <rect x="40" y="98" width="150" height="66" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(50,112)"><rect width="26" height="26" rx="6" fill="#E7157B"/><rect x="5" y="7" width="13" height="9.5" rx="2" fill="#fff"/><rect x="9" y="11" width="13" height="9.5" rx="2" fill="#fbcfe8" stroke="#fff" stroke-width="1"/></g>
  <text x="84" y="122" font-size="12" font-weight="700" fill="#0f172a">SQS + DLQ</text>
  <text x="50" y="150" font-size="9.5" fill="#64748b">실패 격리 · 재처리</text>

  <rect x="220" y="98" width="150" height="66" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(230,112)"><rect width="26" height="26" rx="6" fill="#ED7100"/><rect x="5.5" y="5.5" width="6" height="6" rx="1.2" fill="#fff"/><rect x="14" y="5.5" width="6" height="6" rx="1.2" fill="#fff"/><rect x="5.5" y="14" width="6" height="6" rx="1.2" fill="#fff"/><rect x="14" y="14" width="6" height="6" rx="1.2" fill="#fff"/></g>
  <text x="264" y="122" font-size="12" font-weight="700" fill="#0f172a">Worker (ECS)</text>
  <text x="230" y="150" font-size="9.5" fill="#64748b">수집 잡 처리</text>

  <rect x="400" y="92" width="330" height="100" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
  <g transform="translate(410,98)"><rect width="24" height="24" rx="6" fill="#fb923c"/><path d="M12,4 L19,7 C19,14 15,18 12,20 C9,18 5,14 5,7 Z" fill="#fff"/><path d="M9,12 L11,14 L16,9" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="442" y="114" font-size="11.5" font-weight="700" fill="#9a3412">리질리언스 래퍼 (국세청 호출 보호)</text>
  <rect x="414" y="124" width="148" height="26" rx="6" fill="#fff" stroke="#fdba74"/><text x="488" y="141" font-size="10" fill="#9a3412" text-anchor="middle">Retry + backoff·jitter</text>
  <rect x="570" y="124" width="148" height="26" rx="6" fill="#fff" stroke="#fdba74"/><text x="644" y="141" font-size="10" fill="#9a3412" text-anchor="middle">Circuit Breaker</text>
  <rect x="414" y="156" width="148" height="26" rx="6" fill="#fff" stroke="#fdba74"/><text x="488" y="173" font-size="10" fill="#9a3412" text-anchor="middle">Rate Limiter</text>
  <rect x="570" y="156" width="148" height="26" rx="6" fill="#fff" stroke="#fdba74"/><text x="644" y="173" font-size="10" fill="#9a3412" text-anchor="middle">점검 캘린더 인지</text>

  <rect x="760" y="98" width="360" height="66" rx="10" fill="#fef2f2" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g transform="translate(770,112)"><rect width="26" height="26" rx="6" fill="#DD344C"/><path d="M13,4 L21,10 L5,10 Z" fill="#fff"/><rect x="6" y="11" width="2.6" height="8" fill="#fff"/><rect x="11.7" y="11" width="2.6" height="8" fill="#fff"/><rect x="17.4" y="11" width="2.6" height="8" fill="#fff"/><rect x="4.5" y="20" width="17" height="2.2" fill="#fff"/></g>
  <text x="804" y="122" font-size="12" font-weight="700" fill="#b91c1c">국세청 홈택스/손택스 (외부 · 수집＋제출)</text>
  <text x="804" y="148" font-size="9.5" fill="#7f1d1d">느림 · 점검 · 폭주 · 레이트리밋 — 우리가 통제 못 함</text>

  <rect x="400" y="200" width="220" height="40" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(408,208)"><rect width="24" height="24" rx="6" fill="#4053D6"/><path d="M13,4 L7,13 L11,13 L9,20 L17,10 L12,10 Z" fill="#fff"/></g>
  <text x="440" y="220" font-size="10.5" font-weight="700" fill="#0f172a">ElastiCache (Redis)</text>
  <text x="440" y="234" font-size="9" fill="#64748b">수집 결과 단기 캐시 → 국세청 호출 절감</text>

  <line x1="190" y1="131" x2="218" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#c)"/>
  <line x1="370" y1="131" x2="398" y2="131" stroke="#64748b" stroke-width="1.6" marker-end="url(#c)"/>
  <line x1="730" y1="131" x2="758" y2="131" stroke="#DD344C" stroke-width="1.6" marker-end="url(#cr)"/>
  <line x1="510" y1="192" x2="510" y2="198" stroke="#4053D6" stroke-width="1.4" marker-end="url(#c)"/>

  <line x1="40" y1="258" x2="1120" y2="258" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- ② 제출 사가 -->
  <text x="40" y="284" font-size="14" font-weight="700" fill="#9d174d">② 셀프 신고(제출) 사가 — 정확히 한 번 (이중 신고 방지)</text>

  <rect x="40" y="298" width="150" height="74" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(50,312)"><rect width="26" height="26" rx="6" fill="#8C4FFF"/><path d="M11,6 L6,13 L11,20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15,6 L20,13 L15,20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="84" y="322" font-size="12" font-weight="700" fill="#0f172a">API — 제출 요청</text>
  <text x="50" y="348" font-size="9.5" fill="#64748b">사용자 "셀프 신고"</text>
  <text x="50" y="364" font-size="9.5" fill="#64748b">→ 사가 시작</text>

  <rect x="220" y="288" width="720" height="118" rx="10" fill="#fdf2f8" stroke="#E7157B" stroke-width="1.6"/>
  <g transform="translate(230,294)"><rect width="24" height="24" rx="6" fill="#E7157B"/><circle cx="8" cy="7" r="2.4" fill="#fff"/><circle cx="17" cy="12" r="2.4" fill="#fff"/><circle cx="8" cy="18" r="2.4" fill="#fff"/><path d="M8,9.4 L8,15.6 M10,8 L15,11 M15,13.5 L10,17" stroke="#fff" stroke-width="1.5" fill="none"/></g>
  <text x="262" y="310" font-size="11.5" font-weight="700" fill="#9d174d">AWS Step Functions (제출 워크플로우)</text>
  <g font-size="10">
    <rect x="234" y="320" width="150" height="44" rx="7" fill="#fff" stroke="#f9a8d4"/><text x="309" y="339" fill="#9d174d" text-anchor="middle" font-weight="700">1. 신고서 검증</text><text x="309" y="354" fill="#475569" text-anchor="middle">계산 스냅샷 일치 확인</text>
    <rect x="404" y="320" width="160" height="44" rx="7" fill="#fff" stroke="#f9a8d4"/><text x="484" y="339" fill="#9d174d" text-anchor="middle" font-weight="700">2. 제출 (idem key)</text><text x="484" y="354" fill="#475569" text-anchor="middle">멱등키로 이중 제출 차단</text>
    <rect x="584" y="320" width="160" height="44" rx="7" fill="#fff" stroke="#f9a8d4"/><text x="664" y="339" fill="#9d174d" text-anchor="middle" font-weight="700">3. 접수확인 폴링</text><text x="664" y="354" fill="#475569" text-anchor="middle">국세청 접수번호 대기</text>
    <rect x="764" y="320" width="160" height="44" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.6"/><text x="844" y="339" fill="#15803d" text-anchor="middle" font-weight="700">4. 완료 기록</text><text x="844" y="354" fill="#475569" text-anchor="middle">접수번호 저장·알림</text>
  </g>
  <line x1="384" y1="342" x2="402" y2="342" stroke="#64748b" stroke-width="1.4" marker-end="url(#c)"/>
  <line x1="564" y1="342" x2="582" y2="342" stroke="#64748b" stroke-width="1.4" marker-end="url(#c)"/>
  <line x1="744" y1="342" x2="762" y2="342" stroke="#64748b" stroke-width="1.4" marker-end="url(#c)"/>
  <text x="234" y="384" font-size="10" fill="#b91c1c">실패/타임아웃 시 → 보상: 제출 상태 재확인(이미 됐나?) · 미완료면 롤백 · 사용자 알림 (절대 "성공" 오판 금지)</text>
  <text x="234" y="399" font-size="9.5" fill="#9d174d">※ 2단계는 국세청에 부작용 — 재시도해도 같은 멱등키면 한 번만 접수</text>

  <line x1="190" y1="335" x2="218" y2="335" stroke="#64748b" stroke-width="1.6" marker-end="url(#c)"/>
  <line x1="484" y1="320" x2="700" y2="166" stroke="#DD344C" stroke-width="1.4" fill="none" marker-end="url(#cr)" stroke-dasharray="5 4"/>
  <text x="560" y="250" font-size="9.5" fill="#b91c1c">제출 → 국세청</text>

  <rect x="970" y="298" width="150" height="74" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(980,312)"><rect width="26" height="26" rx="6" fill="#4053D6"/><ellipse cx="13" cy="8" rx="7" ry="2.4" fill="#fff"/><path d="M6,8 L6,18 C6,20 20,20 20,18 L20,8" fill="none" stroke="#fff" stroke-width="1.9"/></g>
  <text x="1012" y="322" font-size="12" font-weight="700" fill="#0f172a">DynamoDB</text>
  <text x="982" y="348" font-size="9.5" fill="#64748b">제출 상태 + 멱등키</text>
  <text x="982" y="364" font-size="9.5" fill="#64748b">접수번호 (영속)</text>
  <line x1="940" y1="335" x2="968" y2="335" stroke="#64748b" stroke-width="1.4" marker-end="url(#c)"/>

  <line x1="40" y1="424" x2="1120" y2="424" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- ③ 횡단 -->
  <text x="40" y="450" font-size="14" font-weight="700" fill="#334155">③ 횡단 관심사</text>

  <rect x="40" y="462" width="262" height="64" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(50,476)"><rect width="26" height="26" rx="6" fill="#DD344C"/><rect x="7" y="12" width="12" height="9" rx="1.5" fill="#fff"/><path d="M9,12 L9,9.5 C9,5.5 17,5.5 17,9.5 L17,12" fill="none" stroke="#fff" stroke-width="2"/></g>
  <text x="84" y="486" font-size="11.5" font-weight="700" fill="#0f172a">KMS · Secrets Manager</text>
  <text x="50" y="508" font-size="9.5" fill="#7f1d1d">주민번호·소득·계좌 암호화 · PII 분리</text>
  <text x="50" y="522" font-size="9.5" fill="#7f1d1d">본인인증 / 마이데이터 동의</text>

  <rect x="318" y="462" width="262" height="64" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(328,476)"><rect width="26" height="26" rx="6" fill="#4053D6"/><rect x="8" y="5" width="10" height="16" rx="1" fill="#fff"/><path d="M10,9 L16,9 M10,12 L16,12 M10,15 L14,15" stroke="#4053D6" stroke-width="1.3"/></g>
  <text x="362" y="486" font-size="11.5" font-weight="700" fill="#0f172a">룰셋 버저닝 + 계산 스냅샷</text>
  <text x="362" y="508" font-size="9.5" fill="#64748b">연도별 세법 룰셋 고정(S3/DDB)</text>
  <text x="362" y="522" font-size="9.5" fill="#64748b">"어떤 룰로 계산했나" 재현성</text>

  <rect x="596" y="462" width="270" height="64" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(606,476)"><rect width="26" height="26" rx="6" fill="#0d9488"/><rect x="6" y="14" width="4" height="6" fill="#fff"/><rect x="11" y="9" width="4" height="11" fill="#fff"/><rect x="16" y="5" width="4" height="15" fill="#fff"/></g>
  <text x="640" y="486" font-size="11.5" font-weight="700" fill="#0f172a">CloudWatch · X-Ray</text>
  <text x="640" y="508" font-size="9.5" fill="#64748b">국세청 성공률·지연·CB 상태</text>
  <text x="640" y="522" font-size="9.5" fill="#64748b">DLQ 적체 알림 · 분산 트레이스</text>

  <rect x="882" y="462" width="238" height="64" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <g transform="translate(892,476)"><rect width="26" height="26" rx="6" fill="#64748b"/><path d="M8,5 L16,5 L18,8 L18,21 L8,21 Z" fill="#fff"/><path d="M10,11 L16,11 M10,14 L16,14 M10,17 L14,17" stroke="#64748b" stroke-width="1.3"/></g>
  <text x="924" y="486" font-size="11.5" font-weight="700" fill="#0f172a">감사 로그 (CloudTrail)</text>
  <text x="924" y="508" font-size="9.5" fill="#64748b">누가·언제·무엇을 신고했나</text>
  <text x="924" y="522" font-size="9.5" fill="#64748b">규제 대응 · 분쟁 추적</text>

  <text x="30" y="566" font-size="12.5" fill="#0f172a">→ 핵심: <tspan font-weight="700" fill="#9a3412">읽기(수집)</tspan>는 리트라이·CB·캐시로 견디고, <tspan font-weight="700" fill="#9d174d">쓰기(제출)</tspan>는 사가+멱등키로 "정확히 한 번". <tspan font-weight="700">타임아웃을 성공으로 오판하지 않는 것</tspan>이 이 도메인의 생명.</text>
  <text x="30" y="588" font-size="12" fill="#64748b">→ 다음 단계(L3) 후보: 추징 안심보상제 워크플로우 · 시즌 폭증 오토스케일/백프레셔 · 미리보기↔제출 데이터 정합성 · 사기 방지</text>
</svg>
