name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          # PR의 변경 내용 가져오기
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }})

          # 멀티라인 출력을 위한 처리
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info
        id: pr_info
        run: |
          echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.body }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read reviewer persona
        id: persona
        run: |
          PERSONA=$(cat .github/prompts/reviewer-persona.md)
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$PERSONA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call OpenAI API
        id: review
        run: |
          # 시스템 프롬프트와 사용자 메시지 준비
          SYSTEM_PROMPT=$(cat .github/prompts/reviewer-persona.md | jq -Rs .)

          USER_MESSAGE=$(cat <<'ENDOFMESSAGE' | jq -Rs .
          # PR 정보

          ## 제목
          ${{ steps.pr_info.outputs.title }}

          ## 설명
          ${{ steps.pr_info.outputs.body }}

          ## 변경 내용 (diff)
          ```diff
          ${{ steps.diff.outputs.diff }}
          ```

          위 PR을 리뷰해주세요.
          ENDOFMESSAGE
          )

          # OpenAI API 호출
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "{
              \"model\": \"gpt-5.2\",
              \"messages\": [
                {\"role\": \"system\", \"content\": $SYSTEM_PROMPT},
                {\"role\": \"user\", \"content\": $USER_MESSAGE}
              ],
              \"temperature\": 0.7,
              \"max_completion_tokens\": 2000
            }")

          # 응답에서 에러 확인
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::OpenAI API Error: $ERROR"
            REVIEW="API 오류: $ERROR"
          else
            REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "리뷰 생성에 실패했습니다."')
          fi

          # 멀티라인 출력
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## AI Review

          ${{ steps.review.outputs.content }}

          ---
          *이 리뷰는 AI에 의해 자동 생성되었습니다.*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
