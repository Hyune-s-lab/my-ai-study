name: AI PR Review

on:
  # 수동 트리거
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR 번호'
        required: true
        type: number
  # ai-review 라벨 붙이면 실행
  pull_request:
    types: [labeled]

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(gh pr diff ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} | head -500)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info
        id: pr_info
        run: |
          PR_INFO=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json title,body)
          echo "title=$(echo "$PR_INFO" | jq -r '.title')" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$PR_INFO" | jq -r '.body' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Call OpenAI API
        id: review
        run: |
          SYSTEM_PROMPT=$(cat .github/prompts/reviewer-persona.md | jq -Rs .)

          USER_MESSAGE=$(cat <<'ENDOFMESSAGE' | jq -Rs .
          # PR 정보

          ## 제목
          ${{ steps.pr_info.outputs.title }}

          ## 설명
          ${{ steps.pr_info.outputs.body }}

          ## 변경 내용 (diff)
          ```diff
          ${{ steps.diff.outputs.diff }}
          ```

          위 PR을 리뷰해주세요.
          ENDOFMESSAGE
          )

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "{
              \"model\": \"gpt-5.2\",
              \"messages\": [
                {\"role\": \"system\", \"content\": $SYSTEM_PROMPT},
                {\"role\": \"user\", \"content\": $USER_MESSAGE}
              ],
              \"temperature\": 0.7,
              \"max_completion_tokens\": 2000
            }")

          echo "## AI Review" > /tmp/review_comment.md
          echo "" >> /tmp/review_comment.md

          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "::error::OpenAI API Error: $ERROR"
            echo "API 오류: $ERROR" >> /tmp/review_comment.md
          else
            echo "$RESPONSE" | jq -r '.choices[0].message.content // "리뷰 생성에 실패했습니다."' >> /tmp/review_comment.md
          fi

          echo "" >> /tmp/review_comment.md
          echo "---" >> /tmp/review_comment.md
          echo "*이 리뷰는 AI에 의해 자동 생성되었습니다.*" >> /tmp/review_comment.md

      - name: Post review comment
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/review_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
