<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">③ 과거만 본다 (causal mask) → 그래서 K·V를 캐시한다</text>
  <text x="30" y="66" font-size="14" fill="#64748b">행 = 지금 생성 중인 토큰, 열 = 참고 대상. 미래(오른쪽 위)는 막혀 0이 된다.</text>

  <!-- column headers -->
  <text x="135" y="108" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">그</text>
  <text x="189" y="108" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">버그</text>
  <text x="243" y="108" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">고쳤</text>
  <text x="297" y="108" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">그것</text>
  <text x="216" y="92" font-size="11" fill="#94a3b8" text-anchor="middle">— 참고 대상 (Key) —</text>

  <!-- row headers -->
  <text x="103" y="164" font-size="12.5" font-weight="600" fill="#475569" text-anchor="end">그</text>
  <text x="103" y="218" font-size="12.5" font-weight="600" fill="#475569" text-anchor="end">버그</text>
  <text x="103" y="272" font-size="12.5" font-weight="600" fill="#475569" text-anchor="end">고쳤</text>
  <text x="103" y="326" font-size="12.5" font-weight="600" fill="#475569" text-anchor="end">그것</text>

  <!-- row 0 (그) : sees 그 -->
  <rect x="110" y="134" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="135" y="166" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="164" y="134" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="189" y="166" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>
  <rect x="218" y="134" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="243" y="166" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>
  <rect x="272" y="134" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="297" y="166" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>

  <!-- row 1 (버그) -->
  <rect x="110" y="188" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="135" y="220" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="164" y="188" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="189" y="220" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="218" y="188" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="243" y="220" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>
  <rect x="272" y="188" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="297" y="220" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>

  <!-- row 2 (고쳤) -->
  <rect x="110" y="242" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="135" y="274" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="164" y="242" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="189" y="274" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="218" y="242" width="50" height="50" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.6"/><text x="243" y="274" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="272" y="242" width="50" height="50" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.4"/><text x="297" y="274" font-size="15" fill="#cbd5e1" text-anchor="middle">✗</text>

  <!-- row 3 (그것) -->
  <rect x="110" y="296" width="50" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="135" y="328" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="164" y="296" width="50" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="189" y="328" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="218" y="296" width="50" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="243" y="328" font-size="16" fill="#15803d" text-anchor="middle">✓</text>
  <rect x="272" y="296" width="50" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="297" y="328" font-size="16" fill="#15803d" text-anchor="middle">✓</text>

  <text x="216" y="372" font-size="12" fill="#94a3b8" text-anchor="middle">✓ 볼 수 있음 (과거+자기)   ✗ 미래 = 마스킹(0)</text>

  <!-- right panel: link to KV cache -->
  <rect x="380" y="125" width="395" height="222" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="402" y="156" font-size="15" font-weight="700" fill="#1d4ed8">왜 이게 KV 캐시로 이어지나?</text>

  <text x="402" y="188" font-size="13" fill="#0f172a">• 새 토큰이 추가돼도, <tspan font-weight="700" fill="#1d4ed8">과거 토큰의 K·V는</tspan></text>
  <text x="414" y="208" font-size="13" font-weight="700" fill="#1d4ed8">절대 안 바뀐다.</text>
  <text x="402" y="232" font-size="13" fill="#0f172a">  (항상 왼쪽만 보니, 뒤 토큰이 앞에 영향 X)</text>

  <text x="402" y="262" font-size="13" fill="#0f172a">• 그래서 <tspan font-weight="700" fill="#15803d">한 번 계산한 K·V를 저장</tspan>해</text>
  <text x="414" y="282" font-size="13" fill="#0f172a">  다음 토큰 때 재사용 = <tspan font-weight="700" fill="#15803d">KV 캐시</tspan></text>

  <text x="402" y="312" font-size="13" fill="#0f172a">• <tspan font-weight="700" fill="#c2410c">Q</tspan>는 그 순간만 쓰고 버린다</text>
  <text x="414" y="332" font-size="13" fill="#9a3412">  → 'QKV'가 아니라 'KV' 캐시인 이유</text>
</svg>
