<svg xmlns="http://www.w3.org/2000/svg" width="840" height="530" viewBox="0 0 840 530" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="s5d" markerWidth="11" markerHeight="11" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#94a3b8"/></marker>
    <marker id="s5ax" markerWidth="11" markerHeight="11" refX="5" refY="9" orient="auto"><path d="M0,0 L10,0 L5,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="840" height="530" fill="#f8fafc"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">서빙 스택을 백엔드 관점으로 — 입구(high)부터 메탈(low)까지</text>
  <text x="30" y="60" font-size="13.5" fill="#64748b">OSI처럼 위=요청에 가깝고(L7), 아래=하드웨어(L1). KV-aware 라우팅 = "내용(prefix)을 보는" ALB.</text>

  <!-- column headers -->
  <text x="80" y="86" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">익숙한 백엔드 유비</text>
  <text x="375" y="86" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">LLM 서빙 스택</text>
  <text x="752" y="86" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">축 · 최적화층</text>

  <!-- ===== high/low 축 (right) ===== -->
  <line x1="636" y1="104" x2="636" y2="450" stroke="#64748b" stroke-width="2.5" marker-end="url(#s5ax)"/>
  <text x="650" y="108" font-size="11.5" font-weight="700" fill="#1d4ed8">high · 요청 입구(L7)</text>
  <text x="650" y="454" font-size="11.5" font-weight="700" fill="#0e7490">low · 메탈(L1)</text>

  <!-- ===== R0 클라이언트 ===== -->
  <rect x="150" y="96" width="450" height="32" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="375" y="117" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">클라이언트 / 요청</text>
  <text x="80" y="116" font-size="11.5" fill="#475569" text-anchor="middle">사용자</text>

  <!-- ===== R1 라우팅 ===== -->
  <rect x="150" y="140" width="450" height="100" rx="11" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="164" y="159" font-size="12.5" font-weight="700" fill="#1d4ed8">라우팅 (어느 worker로 보내나)</text>
  <rect x="164" y="166" width="422" height="32" rx="7" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  <text x="178" y="187" font-size="12.5" font-weight="700" fill="#15803d">KV / prefix-aware 라우터</text>
  <text x="572" y="187" font-size="10.5" fill="#15803d" text-anchor="end">내용(prefix) 보고 → warm worker</text>
  <rect x="164" y="202" width="422" height="30" rx="7" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="178" y="222" font-size="12" fill="#64748b">round-robin LB</text>
  <text x="572" y="222" font-size="10.5" fill="#94a3b8" text-anchor="end">내용 안 봄 → 그냥 분산</text>
  <text x="80" y="186" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">L7 ALB</text>
  <text x="80" y="204" font-size="11.5" fill="#64748b" text-anchor="middle">↕</text>
  <text x="80" y="222" font-size="11.5" fill="#64748b" text-anchor="middle">L4 LB</text>
  <text x="752" y="192" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">라우팅 최적화</text>

  <!-- ===== R2 엔진 ===== -->
  <rect x="150" y="252" width="450" height="64" rx="11" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="375" y="278" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">서빙 엔진  ·  vLLM / SGLang</text>
  <text x="375" y="299" font-size="10.5" fill="#4338ca" text-anchor="middle">모델 ↔ HTTP API 연결부 · continuous batching · prefix cache</text>
  <text x="80" y="278" font-size="11.5" fill="#475569" text-anchor="middle">WAS</text>
  <text x="80" y="295" font-size="11.5" fill="#475569" text-anchor="middle">앱서버</text>
  <text x="752" y="278" font-size="12" font-weight="700" fill="#3730a3" text-anchor="middle">엔진 최적화</text>
  <text x="752" y="296" font-size="10.5" fill="#c2410c" text-anchor="middle">(+ 풀 분리)</text>

  <!-- ===== R3 모델 내부 ===== -->
  <rect x="150" y="328" width="450" height="60" rx="11" fill="#ffedd5" stroke="#fb923c" stroke-width="1.8"/>
  <text x="375" y="353" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">모델 내부</text>
  <text x="375" y="374" font-size="10.5" fill="#9a3412" text-anchor="middle">attention(Q·K·V) · KV 캐시 · forward pass</text>
  <text x="80" y="356" font-size="11.5" fill="#475569" text-anchor="middle">비즈니스</text>
  <text x="80" y="373" font-size="11.5" fill="#475569" text-anchor="middle">로직</text>
  <text x="752" y="362" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">실제 연산</text>

  <!-- ===== R4 하드웨어 ===== -->
  <rect x="150" y="400" width="450" height="52" rx="11" fill="#cffafe" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="375" y="423" font-size="14" font-weight="700" fill="#0e7490" text-anchor="middle">하드웨어</text>
  <text x="375" y="442" font-size="10.5" fill="#155e75" text-anchor="middle">GPU VRAM · NVLink 도메인</text>
  <text x="80" y="423" font-size="11.5" fill="#475569" text-anchor="middle">물리 서버</text>
  <text x="80" y="440" font-size="11.5" fill="#475569" text-anchor="middle">· 네트워크</text>
  <text x="752" y="430" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">토폴로지</text>

  <!-- connectors (요청 ↓) -->
  <line x1="135" y1="128" x2="135" y2="140" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#s5d)"/>
  <line x1="135" y1="240" x2="135" y2="252" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#s5d)"/>
  <line x1="135" y1="316" x2="135" y2="328" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#s5d)"/>
  <line x1="135" y1="388" x2="135" y2="400" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#s5d)"/>

  <!-- takeaway -->
  <text x="30" y="490" font-size="13" fill="#0f172a">→ <tspan font-weight="700" fill="#64748b">round-robin LB</tspan>는 요청 내용을 안 본다. <tspan font-weight="700" fill="#15803d">KV/prefix-aware 라우터</tspan>는 <tspan font-weight="700">ALB처럼 내용(prefix)을 보고</tspan> warm worker로 보낸다.</text>
  <text x="30" y="512" font-size="12.5" fill="#64748b">→ 단, 이 스택은 OSI처럼 "정렬 축 = 추상화"다. <tspan font-weight="700" fill="#0f172a">4계층 그림(serving-1)의 위아래는 '규모 순서'</tspan>라 방향이 다름에 주의.</text>
</svg>
