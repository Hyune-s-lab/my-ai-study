<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="s4r" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="s4r2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="840" height="410" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">멀티노드 토폴로지 — NVLink 도메인과 18배 격차</text>
  <text x="30" y="63" font-size="14" fill="#64748b">scale-up(NVLink)이 scale-out(IB)보다 GPU당 약 18배 빠르다. 이 격차가 배치 설계의 출발점.</text>

  <!-- ===== Domain A ===== -->
  <rect x="40" y="92" width="320" height="208" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="116" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="middle">NVLink 도메인 A  (랙/노드, ~72 GPU)</text>
  <!-- spokes -->
  <line x1="120" y1="165" x2="200" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="280" y1="165" x2="200" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="120" y1="262" x2="200" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="280" y1="262" x2="200" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <!-- NVSwitch -->
  <rect x="162" y="198" width="76" height="28" rx="7" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.6"/>
  <text x="200" y="217" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">NVSwitch</text>
  <!-- GPUs -->
  <circle cx="120" cy="165" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="120" y="169" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="280" cy="165" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="280" y="169" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="120" cy="262" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="120" y="266" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="280" cy="262" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="280" y="266" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <text x="200" y="290" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">GPU당 ~1.8 TB/s · all-to-all</text>

  <!-- ===== Domain B ===== -->
  <rect x="480" y="92" width="320" height="208" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="116" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="middle">NVLink 도메인 B</text>
  <line x1="560" y1="165" x2="640" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="720" y1="165" x2="640" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="560" y1="262" x2="640" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <line x1="720" y1="262" x2="640" y2="212" stroke="#22c55e" stroke-width="3.5"/>
  <rect x="602" y="198" width="76" height="28" rx="7" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.6"/>
  <text x="640" y="217" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">NVSwitch</text>
  <circle cx="560" cy="165" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="560" y="169" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="720" cy="165" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="720" y="169" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="560" cy="262" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="560" y="266" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>
  <circle cx="720" cy="262" r="27" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/><text x="720" y="266" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">GPU</text>

  <!-- IB link between domains -->
  <line x1="362" y1="196" x2="478" y2="196" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#s4r)" marker-end="url(#s4r2)"/>
  <text x="420" y="180" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">InfiniBand</text>
  <text x="420" y="214" font-size="10.5" fill="#b91c1c" text-anchor="middle">~0.1 TB/s</text>
  <text x="420" y="230" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">≈18배 느림</text>

  <!-- rules -->
  <text x="30" y="334" font-size="12.5" fill="#0f172a">• <tspan font-weight="700" fill="#15803d">TP(텐서 병렬)</tspan> = 매 토큰 all-reduce → <tspan font-weight="700">NVLink 도메인 안</tspan>에 가둔다 (랙 넘으면 급격히 느려짐)</text>
  <text x="30" y="356" font-size="12.5" fill="#0f172a">• <tspan font-weight="700" fill="#b91c1c">PP/EP(파이프라인·전문가 병렬)</tspan> = 통신 드뭄·지연 내성 → <tspan font-weight="700">랙 간(IB)</tspan> 확장 OK</text>
  <text x="30" y="378" font-size="12.5" fill="#0f172a">• <tspan font-weight="700" fill="#1d4ed8">KV 캐시 전송 · cache locality</tspan> = 가능한 한 빠른 링크(NVLink) 위에 (disaggregation 배치도 동일)</text>
</svg>
