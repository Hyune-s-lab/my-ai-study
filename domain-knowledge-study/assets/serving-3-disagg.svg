<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="s3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="s3b" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="840" height="410" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">prefill / decode 분리(disaggregation)와 KV 캐시 이동</text>
  <text x="30" y="63" font-size="14" fill="#64748b">prefill=compute-bound(TTFT), decode=memory-bound(TPOT). 같이 돌리면 서로 간섭한다.</text>

  <!-- ===== 결합형 ===== -->
  <text x="30" y="106" font-size="14" font-weight="700" fill="#b91c1c">[ 결합형 — 한 GPU ]</text>
  <path d="M120,150 L205,150" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#s3)"/>
  <text x="120" y="142" font-size="11" fill="#64748b">요청</text>

  <rect x="210" y="116" width="380" height="74" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="222" y="132" font-size="10.5" fill="#94a3b8">GPU 1대</text>
  <rect x="228" y="138" width="160" height="44" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="308" y="165" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">prefill (burst)</text>
  <rect x="416" y="138" width="158" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="495" y="165" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">decode</text>
  <path d="M392,160 L412,160" stroke="#dc2626" stroke-width="2.4" fill="none" marker-end="url(#s3)"/>
  <text x="402" y="152" font-size="13" fill="#dc2626" text-anchor="middle">↯</text>

  <text x="610" y="142" font-size="12" fill="#b91c1c">prefill 버스트가 decode를</text>
  <text x="610" y="160" font-size="12" fill="#b91c1c">가로채 <tspan font-weight="700">TPOT(p99) 튐</tspan></text>
  <text x="610" y="180" font-size="11" fill="#64748b">(완화책: chunked prefill)</text>

  <line x1="30" y1="212" x2="810" y2="212" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== 분리형 ===== -->
  <text x="30" y="250" font-size="14" font-weight="700" fill="#15803d">[ 분리형 — disaggregation ]</text>

  <path d="M58,300 L148,300" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#s3)"/>
  <text x="58" y="292" font-size="11" fill="#64748b">요청</text>

  <rect x="150" y="266" width="170" height="72" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
  <text x="235" y="298" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">prefill 풀</text>
  <text x="235" y="320" font-size="11" fill="#9a3412" text-anchor="middle">compute-bound · TTFT</text>

  <path d="M320,300 L458,300" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#s3b)"/>
  <text x="389" y="288" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">KV 캐시 전송</text>
  <text x="389" y="318" font-size="10.5" fill="#1d4ed8" text-anchor="middle">NVLink / RDMA / NIXL</text>

  <rect x="460" y="266" width="170" height="72" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="545" y="298" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">decode 풀</text>
  <text x="545" y="320" font-size="11" fill="#1e40af" text-anchor="middle">memory-bound · TPOT</text>

  <path d="M630,300 L720,300" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#s3)"/>
  <text x="726" y="304" font-size="11" fill="#64748b">토큰</text>

  <text x="30" y="372" font-size="12.5" fill="#15803d">→ 간섭 제거 + 단계별 <tspan font-weight="700">독립 스케일/튜닝</tspan> (prefill엔 TP↑, decode는 TPOT 보호)</text>
  <text x="30" y="392" font-size="12" fill="#64748b">→ 대가 = <tspan font-weight="700" fill="#334155">KV 캐시를 worker 간 전송</tspan>. 느린 링크면 이득 상쇄 · 소규모면 결합형+chunked prefill이 유리</text>
</svg>
