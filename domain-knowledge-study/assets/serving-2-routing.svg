<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="s2g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="s2r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker>
    <marker id="s2grn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="840" height="410" fill="#f8fafc"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#0f172a">왜 round-robin은 LLM 서빙에 부족한가</text>
  <text x="30" y="63" font-size="14" fill="#64748b">worker가 GPU에 stateful한 prefix KV 캐시를 들고 있다 → 어디로 보내느냐가 cache 재사용을 좌우.</text>

  <line x1="420" y1="78" x2="420" y2="402" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== LEFT: round-robin ===== -->
  <rect x="30" y="84" width="150" height="26" rx="13" fill="#fee2e2" stroke="#f87171" stroke-width="1.5"/>
  <text x="105" y="102" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">round-robin</text>
  <text x="290" y="102" font-size="12" fill="#7c3aed" text-anchor="middle">같은 prefix 요청 3건</text>
  <rect x="245" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/><rect x="283" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/><rect x="321" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/>

  <rect x="180" y="156" width="100" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="230" y="176" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">라우터 (RR)</text>
  <path d="M262,134 C250,142 242,148 236,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>
  <path d="M300,134 C290,142 250,150 250,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>
  <path d="M338,134 C330,144 280,150 262,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>

  <!-- replicas -->
  <g>
    <rect x="22" y="244" width="86" height="56" rx="9" fill="#fff" stroke="#f87171" stroke-width="1.6"/><text x="65" y="266" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">R1</text><text x="65" y="286" font-size="10.5" fill="#dc2626" text-anchor="middle">↻ 재계산</text>
    <rect x="116" y="244" width="86" height="56" rx="9" fill="#fff" stroke="#f87171" stroke-width="1.6"/><text x="159" y="266" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">R2</text><text x="159" y="286" font-size="10.5" fill="#dc2626" text-anchor="middle">↻ 재계산</text>
    <rect x="210" y="244" width="86" height="56" rx="9" fill="#fff" stroke="#f87171" stroke-width="1.6"/><text x="253" y="266" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">R3</text><text x="253" y="286" font-size="10.5" fill="#dc2626" text-anchor="middle">↻ 재계산</text>
    <rect x="304" y="244" width="86" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="347" y="266" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="middle">R4</text><text x="347" y="286" font-size="10.5" fill="#94a3b8" text-anchor="middle">idle</text>
  </g>
  <path d="M210,188 C150,210 90,225 65,242" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#s2r)"/>
  <path d="M226,188 C200,212 175,228 159,242" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#s2r)"/>
  <path d="M244,188 C250,212 252,228 253,242" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#s2r)"/>
  <text x="30" y="338" font-size="12.5" fill="#b91c1c">→ prefix가 흩어져 <tspan font-weight="700">각자 재계산</tspan></text>
  <text x="30" y="358" font-size="12.5" fill="#b91c1c">　 TTFT↑ · GPU 연산 낭비 · cache hit율↓</text>

  <!-- ===== RIGHT: cache-aware ===== -->
  <rect x="448" y="84" width="170" height="26" rx="13" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="533" y="102" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">KV / prefix cache-aware</text>
  <text x="700" y="102" font-size="12" fill="#7c3aed" text-anchor="middle">같은 prefix 요청 3건</text>
  <rect x="655" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/><rect x="693" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/><rect x="731" y="112" width="34" height="22" rx="6" fill="#ede9fe" stroke="#a78bfa"/>

  <rect x="598" y="156" width="130" height="30" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="663" y="176" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">라우터 (KV-aware)</text>
  <path d="M672,134 C668,142 666,148 665,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>
  <path d="M710,134 C700,142 680,150 675,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>
  <path d="M748,134 C740,144 700,150 685,155" stroke="#64748b" stroke-width="1.3" fill="none" marker-end="url(#s2g)"/>

  <g>
    <rect x="500" y="244" width="92" height="56" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2.4"/><text x="546" y="266" font-size="12.5" font-weight="700" fill="#15803d" text-anchor="middle">R1 ✓ warm</text><text x="546" y="286" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">cache HIT</text>
    <rect x="600" y="244" width="62" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="631" y="276" font-size="11.5" fill="#94a3b8" text-anchor="middle">R2</text>
    <rect x="670" y="244" width="62" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="701" y="276" font-size="11.5" fill="#94a3b8" text-anchor="middle">R3</text>
    <rect x="740" y="244" width="62" height="56" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/><text x="771" y="276" font-size="11.5" fill="#94a3b8" text-anchor="middle">R4</text>
  </g>
  <path d="M655,188 C620,210 575,226 552,242" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#s2grn)"/>
  <text x="600" y="222" font-size="11" font-weight="700" fill="#16a34a">3건 모두 →</text>
  <text x="448" y="338" font-size="12.5" fill="#15803d">→ warm replica로 <tspan font-weight="700">모아 보냄</tspan> · prefix 재사용 · TTFT↓</text>
  <text x="448" y="358" font-size="12" fill="#64748b">　 단, 한 곳 과부하 주의 → <tspan font-weight="700" fill="#334155">캐시 점수 + 부하 점수 합성</tspan> (§3.3)</text>
</svg>
